[project]
name = "application-of-dsa-server"
version = "0.1.0"
description = "FastAPI backend for Application of DSA — real-world DS/algorithm APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.140.5",
]

[project.scripts]
application-of-dsa-server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"
